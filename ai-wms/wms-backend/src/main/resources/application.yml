# =====================================================================
#  AI-WMS 应用配置
# =====================================================================
server:
  port: 8080
  servlet:
    context-path: /api          # 所有接口统一前缀 /api

spring:
  application:
    name: wms-backend

  # ---------- 数据源（MySQL）----------
  # ⚠️ 密码走环境变量注入，**不写默认值** —— 配置文件要提交到公开仓库，不能带密码。
  #    未设置时启动直接报 "Could not resolve placeholder 'DB_PASSWORD'"，
  #    这是刻意的：宁可起不来，也不要悄悄用一个弱密码连上库。
  #    变量名与 wms-agent 的 .env 保持一致，三个服务共用一份环境变量。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_wms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- Redis ----------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

  # ---------- JSON 序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null   # null 字段不返回，减小响应体

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aiwms.entity
  configuration:
    map-underscore-to-camel-case: true     # 数据库下划线 -> Java 驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 打印 SQL（开发期）
  global-config:
    banner: false
    db-config:
      id-type: auto                        # 主键自增
      logic-delete-field: deleted          # 逻辑删除字段（若实体有这个字段）
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- JWT（登录鉴权）----------
# ⚠️ 密钥走环境变量，不提交。必须是 32 字节以上——HS256 的密钥长度下限。
#    泄露的后果：任何人可以伪造任意角色的 token（包括 admin）。
jwt:
  secret: ${JWT_SECRET}
  expire-hours: 8                             # 一个班次的有效期

# ---------- 日志 ----------
logging:
  level:
    root: info
    com.aiwms: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
